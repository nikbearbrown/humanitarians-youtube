<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, -apple-system, sans-serif">
  <rect width="780" height="360" fill="#FFFFFF"/>
  <text x="40" y="44" font-family="'EB Garamond', Georgia, serif" font-size="24" fill="#2a1a0e">Same task, one subtle bug</text>
  <rect x="40" y="56" width="46" height="4" fill="#C8860E"/>
  <!-- correct pipeline -->
  <text x="40" y="90" font-size="13" font-weight="700" fill="#2a1a0e">CORRECT — filter, then count</text>
  <g font-family="'JetBrains Mono', monospace" font-size="12">
    <rect x="40" y="100" width="330" height="180" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="2"/>
    <text x="56" y="128" fill="#2a1a0e">df = read_csv(...)</text>
    <rect x="52" y="140" width="300" height="24" fill="#C8102E" fill-opacity="0.12"/>
    <text x="56" y="157" fill="#C8102E">joined = df[year == 2025]</text>
    <text x="56" y="186" fill="#2a1a0e">(joined</text>
    <text x="56" y="210" fill="#2a1a0e">  .groupby("book")</text>
    <text x="56" y="234" fill="#2a1a0e">  .size()</text>
    <text x="56" y="258" fill="#2a1a0e">  .head(5))</text>
  </g>
  <!-- AI version -->
  <text x="410" y="90" font-size="13" font-weight="700" fill="#545454">AI VERSION — filter after group</text>
  <g font-family="'JetBrains Mono', monospace" font-size="12">
    <rect x="410" y="100" width="330" height="180" fill="#FFFFFF" stroke="#D4D4D4"/>
    <text x="426" y="128" fill="#2a1a0e">df = read_csv(...)</text>
    <text x="426" y="152" fill="#2a1a0e">(df</text>
    <text x="426" y="176" fill="#2a1a0e">  .groupby("book")</text>
    <text x="426" y="200" fill="#2a1a0e">  .size()</text>
    <rect x="422" y="212" width="300" height="24" fill="#C8102E" fill-opacity="0.18"/>
    <text x="426" y="229" fill="#C8102E">  [year == 2025]  (bug)</text>
    <text x="426" y="258" fill="#545454"># counts ALL users first</text>
  </g>
  <text x="40" y="322" font-size="12" fill="#545454">The AI code runs and looks right — but it answers the wrong question. Reading it line by line is the skill.</text>
</svg>
