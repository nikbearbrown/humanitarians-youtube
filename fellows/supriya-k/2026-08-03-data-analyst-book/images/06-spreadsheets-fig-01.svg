<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, -apple-system, sans-serif">
  <rect width="780" height="360" fill="#FFFFFF"/>
  <text x="40" y="44" font-family="'EB Garamond', Georgia, serif" font-size="24" fill="#2a1a0e">Clean first, then summarize</text>
  <rect x="40" y="56" width="46" height="4" fill="#C8860E"/>
  <!-- messy sheet -->
  <text x="40" y="90" font-size="13" font-weight="700" fill="#545454">BEFORE — messy signups</text>
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#2a1a0e">
    <rect x="40" y="100" width="360" height="150" fill="#FFFFFF" stroke="#D4D4D4"/>
    <line x1="40" y1="124" x2="400" y2="124" stroke="#D4D4D4"/>
    <text x="50" y="118" fill="#545454">email            city        date</text>
    <text x="50" y="144">ana@x.com        Boston      03/04/25</text>
    <text x="50" y="168">ana@x.com        boston      2025-03-04</text>
    <text x="50" y="192">rob@x.com        BOSTON      04 Mar 25</text>
    <text x="50" y="216">sam@x.com        Austin      2025-03-11</text>
  </g>
  <!-- circles on issues -->
  <ellipse cx="120" cy="163" rx="52" ry="12" fill="none" stroke="#C8102E" stroke-width="1.5"/>
  <ellipse cx="250" cy="175" rx="60" ry="26" fill="none" stroke="#C8102E" stroke-width="1.5"/>
  <ellipse cx="340" cy="187" rx="48" ry="30" fill="none" stroke="#C8102E" stroke-width="1.5"/>
  <text x="40" y="272" font-size="11" fill="#C8102E">duplicate email | mixed case | two date formats</text>
  <!-- arrow -->
  <path d="M420 175 l24 0 l0 -6 l12 9 l-12 9 l0 -6 l-24 0 z" fill="#2a1a0e"/>
  <!-- pivot -->
  <text x="480" y="90" font-size="13" font-weight="700" fill="#2a1a0e">AFTER — signups by city</text>
  <g font-family="'JetBrains Mono', monospace" font-size="12" fill="#2a1a0e">
    <rect x="480" y="100" width="240" height="120" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="2"/>
    <line x1="480" y1="126" x2="720" y2="126" stroke="#D4D4D4"/>
    <text x="492" y="119" fill="#545454">city        signups</text>
    <text x="492" y="150">Boston          2</text>
    <text x="492" y="178">Austin          1</text>
  </g>
  <text x="40" y="330" font-size="12" fill="#545454">Trim + lowercase, standardize dates, drop duplicate emails — then the pivot is trustworthy.</text>
</svg>
