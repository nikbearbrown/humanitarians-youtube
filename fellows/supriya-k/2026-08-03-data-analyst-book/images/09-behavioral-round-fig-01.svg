<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="Inter, -apple-system, sans-serif">
  <rect width="780" height="340" fill="#FFFFFF"/>
  <text x="40" y="44" font-family="'EB Garamond', Georgia, serif" font-size="24" fill="#2a1a0e">STAR — the Result is the point</text>
  <rect x="40" y="56" width="46" height="4" fill="#C8860E"/>
  <!-- four stacked segments -->
  <g>
    <rect x="40" y="86" width="700" height="46" fill="#FFFFFF" stroke="#D4D4D4"/>
    <rect x="40" y="86" width="90" height="46" fill="#545454"/>
    <text x="85" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">S</text>
    <text x="146" y="107" font-size="12" fill="#2a1a0e">Situation — teammate wanted to report signups</text>
    <text x="146" y="124" font-size="12" fill="#2a1a0e">including test accounts.</text>
  </g>
  <g>
    <rect x="40" y="138" width="700" height="46" fill="#FFFFFF" stroke="#D4D4D4"/>
    <rect x="40" y="138" width="90" height="46" fill="#545454"/>
    <text x="85" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">T</text>
    <text x="146" y="166" font-size="12" fill="#2a1a0e">Task — the leadership number had to be accurate.</text>
  </g>
  <g>
    <rect x="40" y="190" width="700" height="46" fill="#FFFFFF" stroke="#D4D4D4"/>
    <rect x="40" y="190" width="90" height="46" fill="#545454"/>
    <text x="85" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">A</text>
    <text x="146" y="211" font-size="12" fill="#2a1a0e">Action — showed the ~12% inflation from test data,</text>
    <text x="146" y="228" font-size="12" fill="#2a1a0e">proposed a filter we both agreed on.</text>
  </g>
  <g>
    <rect x="40" y="242" width="700" height="46" fill="#C8102E"/>
    <text x="85" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">R</text>
    <line x1="130" y1="242" x2="130" y2="288" stroke="#FFFFFF" stroke-opacity="0.4"/>
    <text x="146" y="263" font-size="12" fill="#FFFFFF" font-weight="700">Result — shipped the corrected metric; it became</text>
    <text x="146" y="280" font-size="12" fill="#FFFFFF" font-weight="700">the team's standard definition.</text>
  </g>
  <text x="40" y="316" font-size="12" fill="#545454">Competency scored: influence + data judgment. The quantified result (red) is what most answers forget.</text>
</svg>
