<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="330" fill="#FFFFFF"/>
  <text x="40" y="44" font-family="'EB Garamond', Georgia, serif" font-size="24" fill="#2a1a0e">Name the pattern, reach for the function</text>
  <rect x="40" y="56" width="46" height="4" fill="#C8860E"/>
  <!-- header -->
  <g font-size="12" font-weight="700" fill="#545454">
    <text x="52" y="92">CUE PHRASE</text>
    <text x="300" y="92">PATTERN</text>
    <text x="540" y="92">WINDOW FUNCTION</text>
  </g>
  <line x1="40" y1="100" x2="720" y2="100" stroke="#D4D4D4"/>
  <!-- rows -->
  <g font-size="13" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">
    <text x="540" y="132">ROW_NUMBER()</text>
    <text x="540" y="172">SUM() OVER()</text>
    <text x="540" y="212">LAG()</text>
    <text x="540" y="252">row-number diff</text>
    <text x="540" y="292">ROW_NUMBER()=1</text>
  </g>
  <g font-size="13" fill="#2a1a0e">
    <text x="300" y="132">Top-N per group</text>
    <text x="300" y="172">Running total</text>
    <text x="300" y="212">Month-over-month</text>
    <text x="300" y="252">Gaps &amp; islands</text>
    <text x="300" y="292">Deduplication</text>
  </g>
  <g font-size="12" fill="#545454">
    <text x="52" y="132">"per user, their 2nd…"</text>
    <text x="52" y="172">"cumulative by day"</text>
    <text x="52" y="212">"change since last"</text>
    <text x="52" y="252">"consecutive streak"</text>
    <text x="52" y="292">"keep one row each"</text>
  </g>
  <line x1="40" y1="112" x2="720" y2="112" stroke="#D4D4D4" stroke-opacity="0.6"/>
  <line x1="40" y1="152" x2="720" y2="152" stroke="#D4D4D4" stroke-opacity="0.6"/>
  <line x1="40" y1="192" x2="720" y2="192" stroke="#D4D4D4" stroke-opacity="0.6"/>
  <line x1="40" y1="232" x2="720" y2="232" stroke="#D4D4D4" stroke-opacity="0.6"/>
  <line x1="40" y1="272" x2="720" y2="272" stroke="#D4D4D4" stroke-opacity="0.6"/>
  <rect x="524" y="118" width="150" height="20" fill="#C8102E" fill-opacity="0.10"/>
</svg>
