<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="40" y="44" font-family="'EB Garamond', Georgia, serif" font-size="24" fill="#2a1a0e">"Tell me about yourself" — weak vs. rewrite</text>
  <rect x="40" y="56" width="46" height="4" fill="#C8860E"/>
  <!-- weak -->
  <rect x="40" y="80" width="330" height="230" fill="#FFFFFF" stroke="#D4D4D4"/>
  <text x="56" y="106" font-size="13" font-weight="700" fill="#545454">WEAK — chronological, no focus</text>
  <text x="56" y="140" font-size="12" fill="#2a1a0e">"I was born in…</text>
  <text x="56" y="162" font-size="12" fill="#2a1a0e">I studied economics…</text>
  <text x="56" y="184" font-size="12" fill="#2a1a0e">I like data…</text>
  <text x="56" y="206" font-size="12" fill="#2a1a0e">I did a bootcamp…"</text>
  <text x="56" y="286" font-size="11" fill="#545454">No point, no relevance, runs long.</text>
  <!-- rewrite -->
  <rect x="390" y="80" width="330" height="230" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="2"/>
  <text x="406" y="106" font-size="13" font-weight="700" fill="#2a1a0e">REWRITE — present &gt; past &gt; why</text>
  <g>
    <rect x="406" y="122" width="60" height="20" fill="#C8102E"/>
    <text x="436" y="137" text-anchor="middle" font-size="11" fill="#FFFFFF">PRESENT</text>
    <text x="474" y="137" font-size="12" fill="#2a1a0e">Just finished a bootcamp…</text>
  </g>
  <g>
    <rect x="406" y="164" width="60" height="20" fill="#545454"/>
    <text x="436" y="179" text-anchor="middle" font-size="11" fill="#FFFFFF">PAST</text>
    <text x="474" y="179" font-size="12" fill="#2a1a0e">SQL on a retail internship…</text>
  </g>
  <g>
    <rect x="406" y="206" width="60" height="20" fill="#C8860E"/>
    <text x="436" y="221" text-anchor="middle" font-size="11" fill="#FFFFFF">WHY</text>
    <text x="474" y="221" font-size="12" fill="#2a1a0e">…exactly this role.</text>
  </g>
  <text x="406" y="286" font-size="11" fill="#545454">Concise, relevant, ends pointed at the job.</text>
  <text x="40" y="345" font-size="12" fill="#545454">Sixty seconds, not five minutes.</text>
</svg>
