<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, -apple-system, sans-serif">
  <rect width="720" height="360" fill="#FFFFFF"/>
  <text x="40" y="44" font-family="'EB Garamond', Georgia, serif" font-size="24" fill="#2a1a0e">Maya's three-week plan — sized by weakness</text>
  <rect x="40" y="56" width="46" height="4" fill="#C8860E"/>
  <!-- week rows -->
  <g font-size="12" fill="#545454">
    <text x="40" y="100">Week 1</text>
    <text x="40" y="180">Week 2</text>
    <text x="40" y="260">Week 3</text>
  </g>
  <!-- Week 1: SQL heavy -->
  <g>
    <rect x="120" y="80" width="330" height="34" fill="#C8102E"/>
    <text x="130" y="102" font-size="13" fill="#FFFFFF" font-weight="700">SQL I &amp; II  (90 min/day)</text>
    <rect x="455" y="80" width="200" height="34" fill="#545454"/>
    <text x="465" y="102" font-size="13" fill="#FFFFFF">Statistics refresh</text>
  </g>
  <!-- Week 2: Case heavy -->
  <g>
    <rect x="120" y="160" width="150" height="34" fill="#787878"/>
    <text x="130" y="182" font-size="13" fill="#FFFFFF">Sheets + pandas</text>
    <rect x="275" y="160" width="380" height="34" fill="#C8102E"/>
    <text x="285" y="182" font-size="13" fill="#FFFFFF" font-weight="700">Case round + one full take-home</text>
  </g>
  <!-- Week 3: integrate -->
  <g>
    <rect x="120" y="240" width="180" height="34" fill="#545454"/>
    <text x="130" y="262" font-size="13" fill="#FFFFFF">Behavioral stories</text>
    <rect x="305" y="240" width="350" height="34" fill="#C8102E"/>
    <text x="315" y="262" font-size="13" fill="#FFFFFF" font-weight="700">Full mock loop x2 + re-drill weakest</text>
  </g>
  <!-- legend -->
  <g font-size="11">
    <rect x="120" y="300" width="14" height="14" fill="#C8102E"/>
    <text x="140" y="311" fill="#545454">Biggest investment (weak + high-weight)</text>
    <rect x="400" y="300" width="14" height="14" fill="#787878"/>
    <text x="420" y="311" fill="#545454">Maintenance</text>
  </g>
  <text x="40" y="345" font-size="12" fill="#545454">Time is lopsided on purpose — most hours go where she's weakest and it counts most.</text>
</svg>
