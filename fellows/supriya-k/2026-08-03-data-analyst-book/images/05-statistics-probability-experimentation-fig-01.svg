<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Inter, -apple-system, sans-serif">
  <rect width="640" height="380" fill="#FFFFFF"/>
  <text x="40" y="44" font-family="'EB Garamond', Georgia, serif" font-size="24" fill="#2a1a0e">Is 4.0% to 4.3% real?</text>
  <rect x="40" y="56" width="46" height="4" fill="#C8860E"/>
  <!-- axes -->
  <line x1="120" y1="300" x2="560" y2="300" stroke="#2a1a0e"/>
  <line x1="120" y1="90" x2="120" y2="300" stroke="#2a1a0e"/>
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#545454">
    <text x="112" y="304" text-anchor="end">0%</text>
    <text x="112" y="215" text-anchor="end">3%</text>
    <text x="112" y="130" text-anchor="end">5%</text>
  </g>
  <line x1="120" y1="215" x2="560" y2="215" stroke="#D4D4D4" stroke-opacity="0.6"/>
  <line x1="120" y1="130" x2="560" y2="130" stroke="#D4D4D4" stroke-opacity="0.6"/>
  <!-- Bar A (control) 4.0% -> height scaled: 5%=170px span(130..300). 4.0% => 300-136=164 -> y=164 -->
  <rect x="200" y="164" width="90" height="136" fill="#545454"/>
  <text x="245" y="330" text-anchor="middle" font-size="12" fill="#2a1a0e">A — control</text>
  <text x="245" y="156" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#2a1a0e">4.0%</text>
  <!-- Bar B (variant) 4.3% => 300-146=154 -> y=154 -->
  <rect x="380" y="154" width="90" height="146" fill="#C8102E"/>
  <text x="425" y="330" text-anchor="middle" font-size="12" fill="#2a1a0e">B — new button</text>
  <text x="425" y="146" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#2a1a0e">4.3%</text>
  <!-- CI whiskers overlapping -->
  <g stroke="#2a1a0e" stroke-width="1.5">
    <line x1="245" y1="150" x2="245" y2="182"/>
    <line x1="237" y1="150" x2="253" y2="150"/>
    <line x1="237" y1="182" x2="253" y2="182"/>
    <line x1="425" y1="138" x2="425" y2="172"/>
    <line x1="417" y1="138" x2="433" y2="138"/>
    <line x1="417" y1="172" x2="433" y2="172"/>
  </g>
  <rect x="230" y="150" width="210" height="32" fill="#C8860E" fill-opacity="0.12"/>
  <text x="40" y="362" font-size="12" fill="#545454">The confidence intervals overlap — before shipping, check sample size, random split, and no peeking.</text>
</svg>
