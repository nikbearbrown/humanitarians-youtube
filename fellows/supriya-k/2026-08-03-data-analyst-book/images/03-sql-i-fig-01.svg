<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, -apple-system, sans-serif">
  <rect width="760" height="340" fill="#FFFFFF"/>
  <text x="40" y="44" font-family="'EB Garamond', Georgia, serif" font-size="24" fill="#2a1a0e">Joins — which rows come back</text>
  <rect x="40" y="56" width="46" height="4" fill="#C8860E"/>
  <!-- INNER -->
  <g>
    <text x="150" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#2a1a0e">INNER JOIN</text>
    <circle cx="130" cy="170" r="55" fill="none" stroke="#545454"/>
    <circle cx="180" cy="170" r="55" fill="none" stroke="#545454"/>
    <path d="M155 128 A55 55 0 0 0 155 212 A55 55 0 0 0 155 128 Z" fill="#C8102E" fill-opacity="0.85"/>
    <text x="110" y="175" font-size="11" fill="#545454">A</text>
    <text x="198" y="175" font-size="11" fill="#545454">B</text>
    <text x="155" y="255" text-anchor="middle" font-size="11" fill="#545454">Matches in both</text>
  </g>
  <!-- LEFT -->
  <g>
    <text x="380" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#2a1a0e">LEFT JOIN</text>
    <path d="M360 115 a55 55 0 0 0 0 110 a55 55 0 0 0 0 -110 Z" fill="#C8102E" fill-opacity="0.85"/>
    <path d="M385 128 A55 55 0 0 0 385 212 A55 55 0 0 0 385 128 Z" fill="#C8102E" fill-opacity="0.85"/>
    <circle cx="360" cy="170" r="55" fill="none" stroke="#545454"/>
    <circle cx="410" cy="170" r="55" fill="none" stroke="#545454"/>
    <text x="340" y="175" font-size="11" fill="#2a1a0e">A</text>
    <text x="428" y="175" font-size="11" fill="#545454">B</text>
    <text x="385" y="255" text-anchor="middle" font-size="11" fill="#545454">All of A + matches</text>
  </g>
  <!-- RIGHT -->
  <g>
    <text x="610" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#2a1a0e">RIGHT JOIN</text>
    <path d="M640 115 a55 55 0 0 1 0 110 a55 55 0 0 1 0 -110 Z" fill="#C8102E" fill-opacity="0.85"/>
    <path d="M615 128 A55 55 0 0 1 615 212 A55 55 0 0 1 615 128 Z" fill="#C8102E" fill-opacity="0.85"/>
    <circle cx="590" cy="170" r="55" fill="none" stroke="#545454"/>
    <circle cx="640" cy="170" r="55" fill="none" stroke="#545454"/>
    <text x="570" y="175" font-size="11" fill="#545454">A</text>
    <text x="658" y="175" font-size="11" fill="#2a1a0e">B</text>
    <text x="615" y="255" text-anchor="middle" font-size="11" fill="#545454">All of B + matches</text>
  </g>
  <text x="40" y="305" font-size="12" fill="#545454">Unmatched rows keep NULLs on the other table's columns. "Everyone + their data if any" = LEFT JOIN.</text>
</svg>
