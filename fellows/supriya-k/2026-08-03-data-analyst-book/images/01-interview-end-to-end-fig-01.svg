<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="Inter, -apple-system, sans-serif">
  <rect width="920" height="300" fill="#FFFFFF"/>
  <text x="40" y="44" font-family="'EB Garamond', Georgia, serif" font-size="26" fill="#2a1a0e">The interview, stage by stage</text>
  <rect x="40" y="58" width="46" height="4" fill="#C8860E"/>
  <!-- stages -->
  <g>
    <!-- box template: title (ink), what's tested (secondary), duration (mono ochre) -->
    <!-- 6 boxes across -->
    <g>
      <rect x="40" y="90" width="130" height="150" fill="#FFFFFF" stroke="#D4D4D4"/>
      <text x="105" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#2a1a0e">Recruiter</text>
      <text x="105" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#2a1a0e">screen</text>
      <text x="105" y="170" text-anchor="middle" font-size="11" fill="#545454">Fit,</text>
      <text x="105" y="185" text-anchor="middle" font-size="11" fill="#545454">logistics,</text>
      <text x="105" y="200" text-anchor="middle" font-size="11" fill="#545454">salary</text>
      <text x="105" y="228" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C8860E">15–30 min</text>
    </g>
    <g>
      <rect x="185" y="90" width="130" height="150" fill="#FFFFFF" stroke="#D4D4D4"/>
      <text x="250" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#2a1a0e">Hiring mgr</text>
      <text x="250" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#2a1a0e">chat</text>
      <text x="250" y="170" text-anchor="middle" font-size="11" fill="#545454">Experience,</text>
      <text x="250" y="185" text-anchor="middle" font-size="11" fill="#545454">motivation</text>
      <text x="250" y="228" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C8860E">30–45 min</text>
    </g>
    <g>
      <rect x="330" y="90" width="130" height="150" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="2"/>
      <text x="395" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#2a1a0e">Technical</text>
      <text x="395" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#2a1a0e">screen</text>
      <text x="395" y="170" text-anchor="middle" font-size="11" fill="#545454">SQL / Python</text>
      <text x="395" y="185" text-anchor="middle" font-size="11" fill="#545454">+ explaining it</text>
      <text x="395" y="228" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C8860E">45–60 min</text>
    </g>
    <g>
      <rect x="475" y="90" width="130" height="150" fill="#FFFFFF" stroke="#D4D4D4"/>
      <text x="540" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#2a1a0e">Statistics</text>
      <text x="540" y="170" text-anchor="middle" font-size="11" fill="#545454">Reasoning,</text>
      <text x="540" y="185" text-anchor="middle" font-size="11" fill="#545454">A/B tests</text>
      <text x="540" y="228" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C8860E">30–45 min</text>
    </g>
    <g>
      <rect x="620" y="90" width="130" height="150" fill="#FFFFFF" stroke="#D4D4D4"/>
      <text x="685" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#2a1a0e">Case /</text>
      <text x="685" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#2a1a0e">business</text>
      <text x="685" y="170" text-anchor="middle" font-size="11" fill="#545454">Framing,</text>
      <text x="685" y="185" text-anchor="middle" font-size="11" fill="#545454">recommendation</text>
      <text x="685" y="228" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C8860E">take-home</text>
    </g>
    <g>
      <rect x="765" y="90" width="130" height="150" fill="#FFFFFF" stroke="#D4D4D4"/>
      <text x="830" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#2a1a0e">Behavioral</text>
      <text x="830" y="170" text-anchor="middle" font-size="11" fill="#545454">Collaboration,</text>
      <text x="830" y="185" text-anchor="middle" font-size="11" fill="#545454">ambiguity</text>
      <text x="830" y="228" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C8860E">30–45 min</text>
    </g>
  </g>
  <!-- arrows between -->
  <g fill="#C8102E">
    <path d="M172 165 l11 0 l0 -5 l8 7 l-8 7 l0 -5 l-11 0 z"/>
    <path d="M317 165 l11 0 l0 -5 l8 7 l-8 7 l0 -5 l-11 0 z"/>
    <path d="M462 165 l11 0 l0 -5 l8 7 l-8 7 l0 -5 l-11 0 z"/>
    <path d="M607 165 l11 0 l0 -5 l8 7 l-8 7 l0 -5 l-11 0 z"/>
    <path d="M752 165 l11 0 l0 -5 l8 7 l-8 7 l0 -5 l-11 0 z"/>
  </g>
  <text x="40" y="278" font-size="12" fill="#545454">Each stage scores a different thing. Most loops run 3–5 rounds over 2–6 weeks.</text>
</svg>
