<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Inter, -apple-system, sans-serif">
  <rect width="820" height="300" fill="#FFFFFF"/>
  <text x="40" y="44" font-family="'EB Garamond', Georgia, serif" font-size="24" fill="#2a1a0e">PACE on "weekend rides are flat"</text>
  <rect x="40" y="56" width="46" height="4" fill="#C8860E"/>
  <!-- four steps -->
  <g>
    <rect x="40" y="90" width="170" height="110" fill="#C8102E"/>
    <text x="56" y="118" font-size="15" font-weight="700" fill="#FFFFFF">Plan</text>
    <text x="56" y="146" font-size="11" fill="#FFFFFF">What is "flat"?</text>
    <text x="56" y="164" font-size="11" fill="#FFFFFF">Define the metric</text>
    <text x="56" y="182" font-size="11" fill="#FFFFFF">and success.</text>
  </g>
  <g>
    <rect x="230" y="90" width="170" height="110" fill="#2a1a0e"/>
    <text x="246" y="118" font-size="15" font-weight="700" fill="#FFFFFF">Analyze</text>
    <text x="246" y="146" font-size="11" fill="#FFFFFF">Demand vs supply?</text>
    <text x="246" y="164" font-size="11" fill="#FFFFFF">Segment by city,</text>
    <text x="246" y="182" font-size="11" fill="#FFFFFF">vs weekday trend.</text>
  </g>
  <g>
    <rect x="420" y="90" width="170" height="110" fill="#545454"/>
    <text x="436" y="118" font-size="15" font-weight="700" fill="#FFFFFF">Construct</text>
    <text x="436" y="146" font-size="11" fill="#FFFFFF">Hypothesis: supply</text>
    <text x="436" y="164" font-size="11" fill="#FFFFFF">shortage in two</text>
    <text x="436" y="182" font-size="11" fill="#FFFFFF">growth cities.</text>
  </g>
  <g>
    <rect x="610" y="90" width="170" height="110" fill="#787878"/>
    <text x="626" y="118" font-size="15" font-weight="700" fill="#FFFFFF">Execute</text>
    <text x="626" y="146" font-size="11" fill="#FFFFFF">Confirm with driver</text>
    <text x="626" y="164" font-size="11" fill="#FFFFFF">hours; recommend</text>
    <text x="626" y="182" font-size="11" fill="#FFFFFF">driver incentives.</text>
  </g>
  <!-- arrows -->
  <g fill="#C8860E">
    <path d="M212 145 l9 0 l0 -5 l8 7 l-8 7 l0 -5 l-9 0 z"/>
    <path d="M402 145 l9 0 l0 -5 l8 7 l-8 7 l0 -5 l-9 0 z"/>
    <path d="M592 145 l9 0 l0 -5 l8 7 l-8 7 l0 -5 l-9 0 z"/>
  </g>
  <text x="40" y="250" font-size="12" fill="#545454">Framing before numbers. The recommendation is defensible because each step states its assumptions.</text>
  <text x="40" y="272" font-size="11" fill="#545454">PACE originates in Google's Advanced Data Analytics program.</text>
</svg>
