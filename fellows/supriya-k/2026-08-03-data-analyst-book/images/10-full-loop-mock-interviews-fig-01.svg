<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Inter, -apple-system, sans-serif">
  <rect width="700" height="360" fill="#FFFFFF"/>
  <text x="40" y="44" font-family="'EB Garamond', Georgia, serif" font-size="24" fill="#2a1a0e">Self-score, then plan from the gaps</text>
  <rect x="40" y="56" width="46" height="4" fill="#C8860E"/>
  <!-- header -->
  <g font-size="12" font-weight="700" fill="#545454">
    <text x="52" y="94">STAGE</text>
    <text x="300" y="94">SCORE (1–3)</text>
  </g>
  <line x1="40" y1="102" x2="660" y2="102" stroke="#D4D4D4"/>
  <!-- rows with dot scores -->
  <g font-size="13" fill="#2a1a0e">
    <text x="52" y="134">Screen</text>
    <text x="52" y="172">SQL</text>
    <text x="52" y="210">Statistics</text>
    <text x="52" y="248">Case</text>
    <text x="52" y="286">Behavioral</text>
  </g>
  <!-- score dots: filled red = attained -->
  <g>
    <!-- Screen 3 -->
    <circle cx="310" cy="130" r="8" fill="#C8102E"/><circle cx="340" cy="130" r="8" fill="#C8102E"/><circle cx="370" cy="130" r="8" fill="#C8102E"/>
    <!-- SQL 2 -->
    <circle cx="310" cy="168" r="8" fill="#C8102E"/><circle cx="340" cy="168" r="8" fill="#C8102E"/><circle cx="370" cy="168" r="8" fill="none" stroke="#D4D4D4"/>
    <!-- Stats 1 (weak, flag) -->
    <circle cx="310" cy="206" r="8" fill="#C8102E"/><circle cx="340" cy="206" r="8" fill="none" stroke="#D4D4D4"/><circle cx="370" cy="206" r="8" fill="none" stroke="#D4D4D4"/>
    <!-- Case 2 -->
    <circle cx="310" cy="244" r="8" fill="#C8102E"/><circle cx="340" cy="244" r="8" fill="#C8102E"/><circle cx="370" cy="244" r="8" fill="none" stroke="#D4D4D4"/>
    <!-- Behavioral 2 -->
    <circle cx="310" cy="282" r="8" fill="#C8102E"/><circle cx="340" cy="282" r="8" fill="#C8102E"/><circle cx="370" cy="282" r="8" fill="none" stroke="#D4D4D4"/>
  </g>
  <!-- flag lowest two -->
  <g>
    <rect x="430" y="196" width="150" height="22" fill="#C8860E" fill-opacity="0.18"/>
    <text x="440" y="211" font-size="11" fill="#2a1a0e">&lt;- fix first (only a 1)</text>
    <rect x="430" y="158" width="150" height="22" fill="#C8860E" fill-opacity="0.10"/>
    <text x="440" y="173" font-size="11" fill="#545454">&lt;- tighten next</text>
  </g>
  <text x="40" y="330" font-size="12" fill="#545454">The plan writes itself: statistics first, then SQL narration and case framing. Keep the strong stages warm.</text>
</svg>
