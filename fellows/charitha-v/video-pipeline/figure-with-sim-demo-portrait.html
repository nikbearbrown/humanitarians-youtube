<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FigureWithSim demo — portrait</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: Inter, sans-serif;
      background: #fff;
      color: #121212;
      padding: 48px 40px 80px;
      max-width: 100%;
    }
    h1 { font-size: 44px; font-weight: 700; margin-bottom: 12px; line-height: 1.15; }
    .section {
      font-family: "JetBrains Mono", monospace;
      font-size: 22px;
      color: #545454;
      margin-bottom: 32px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    p { font-size: 32px; line-height: 1.55; margin-bottom: 28px; }
    figure { margin: 0 0 32px; text-align: center; }
    figure img { max-width: 100%; height: auto; border: 2px solid #D4D4D4; }
    figcaption { font-size: 24px; color: #545454; text-align: left; margin-top: 12px; }
    .sim-wrap {
      border: 2px solid #D4D4D4;
      border-left: 8px solid #C8860E;
      background: #fff;
      overflow: hidden;
      margin-bottom: 24px;
    }
    iframe { width: 100%; height: 720px; border: 0; display: block; }
    .cite { background: #fff8e6; padding: 4px 8px; }
  </style>
</head>
<body>
  <h1>4.1 Displacement and Velocity Vectors</h1>
  <div class="section">Physics Vol. 1 · Chapter 4</div>
  <p>
    As shown in <span class="cite">Figure 4.7</span>, the displacement points from initial to final position.
    The sim sits directly below the figure — same viewport, no scroll hunt.
  </p>
  <figure>
    <img src="http://localhost:3002/media/CNX_UPhysics_04_01_Dispvec.jpg" alt="Figure 4.7" />
    <figcaption><strong>Figure 4.7</strong> — Displacement vector in the plane.</figcaption>
  </figure>
  <div class="sim-wrap">
    <iframe src="http://localhost:3002/embeds/ch04/vector-2d.html" title="Vector 2D sim"></iframe>
  </div>
</body>
</html>
