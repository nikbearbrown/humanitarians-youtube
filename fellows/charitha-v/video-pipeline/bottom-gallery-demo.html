<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bottom gallery layout (old pattern)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: Inter, sans-serif; background: #fff; color: #121212; padding: 32px 40px; max-width: 900px; min-height: 200vh; }
    h1 { font-size: 28px; margin-bottom: 16px; }
    p { font-size: 17px; line-height: 1.65; margin-bottom: 16px; }
    .cite { background: #fff8e6; padding: 2px 4px; }
    .spacer { height: 120vh; color: #8F8F8F; font-size: 14px; display: flex; align-items: center; justify-content: center; border: 1px dashed #D4D4D4; margin: 40px 0; }
    .gallery-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: #7A0000; margin-bottom: 8px; font-weight: 600; }
    iframe { width: 100%; height: 480px; border: 1px solid #D4D4D4; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .chip { padding: 8px 14px; border: 1px solid #D4D4D4; font-size: 13px; background: #f5f5f5; }
  </style>
</head>
<body>
  <h1>4.1 Displacement and Velocity Vectors</h1>
  <p>
    As shown in <span class="cite">Figure 4.7</span>, the displacement vector connects initial and final positions.
    (The simulation gallery is far below — three scroll lengths away.)
  </p>
  <div class="spacer">↓ scroll to find the sim ↓</div>
  <div class="gallery-label">Section simulation gallery</div>
  <iframe src="http://localhost:3002/embeds/ch04/vector-2d.html"></iframe>
  <div class="chips">
    <span class="chip">Vector 2D</span>
    <span class="chip">Vector 3D</span>
    <span class="chip">Orbit</span>
    <span class="chip">Projectile</span>
    <span class="chip">Circular motion</span>
  </div>
</body>
</html>
