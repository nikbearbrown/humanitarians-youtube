<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FigureWithSim demo — Ch. 4</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: Inter, sans-serif; background: #fff; color: #121212; padding: 32px 40px; max-width: 1200px; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .section { font-size: 14px; color: #545454; margin-bottom: 24px; }
    p { font-size: 17px; line-height: 1.65; margin-bottom: 16px; max-width: 900px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; margin-top: 20px; }
    figure { margin: 0; text-align: center; }
    figure img { max-width: 100%; height: auto; border: 1px solid #D4D4D4; }
    figcaption { font-size: 13px; color: #545454; text-align: left; margin-top: 8px; }
    .sim-wrap { border: 1px solid #D4D4D4; border-left: 4px solid #C8860E; background: #fff; overflow: hidden; }
    iframe { width: 100%; height: 520px; border: 0; display: block; }
    .cite { background: #fff8e6; padding: 2px 4px; }
  </style>
</head>
<body>
  <h1>4.1 Displacement and Velocity Vectors</h1>
  <div class="section">Physics Vol. 1 · Chapter 4</div>
  <p>
    To describe motion in two dimensions, we use a displacement vector. As shown in
    <span class="cite">Figure 4.7</span>, the displacement points from the initial to the final position.
    The interactive panel lets you drag vector tips and watch components update.
  </p>
  <div class="grid">
    <figure>
      <img src="http://localhost:3002/media/CNX_UPhysics_04_01_Dispvec.jpg" alt="Figure 4.7 displacement vector" />
      <figcaption><strong>Figure 4.7</strong> — Displacement vector in the plane.</figcaption>
    </figure>
    <div class="sim-wrap">
      <iframe src="http://localhost:3002/embeds/ch04/vector-2d.html" title="Vector 2D sim"></iframe>
    </div>
  </div>
</body>
</html>
