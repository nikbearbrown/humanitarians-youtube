<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MEMORY API — MEDHAVY HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }

  :root{
    --ink:#000; --paper:#fff; --accent:#FFE500; --alert:#FF3B00;
  }

  html,body{ height:100%; background:#d9d9d9; overflow:hidden; }
  body{ display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; color:var(--ink); }

  #stage{
    width:min(100vw, 177.7778vh);
    aspect-ratio:16/9;
    container-type:size;
    position:relative;
    background:var(--paper);
    overflow:hidden;
  }

  /* every size below is in cqw: 100cqw = full stage width */
  #railTop{
    position:absolute; top:0; left:0; right:0; height:3.9cqw;
    border-bottom:.31cqw solid var(--ink);
    display:flex; z-index:50; background:var(--paper);
  }
  #railTop .cell{
    display:flex; align-items:center; padding:0 1.5cqw;
    font-size:1.05cqw; font-weight:700; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap;
  }
  #railTop .cell+.cell{ border-left:.31cqw solid var(--ink); }
  #scene-name{ flex:1; }
  #counter{ background:var(--ink); color:var(--paper); min-width:9cqw; justify-content:center; }

  #progress{ position:absolute; bottom:0; left:0; height:.9cqw; background:var(--ink); width:0; z-index:60; }

  .scene{
    position:absolute; left:0; right:0; top:3.9cqw; bottom:.9cqw;
    padding:3.4cqw 4.7cqw;
    display:none; flex-direction:column; justify-content:center;
  }
  .scene.on{ display:flex; }

  h1{ font-family:'Archivo Black',sans-serif; font-size:7.6cqw; line-height:.92; letter-spacing:-.03em; text-transform:uppercase; }
  h2{ font-family:'Archivo Black',sans-serif; font-size:4.4cqw; line-height:1; letter-spacing:-.02em; text-transform:uppercase; margin-bottom:2.1cqw; }
  .kicker{ font-size:1.25cqw; font-weight:700; letter-spacing:.3em; text-transform:uppercase; margin-bottom:1.7cqw; }
  .lede{ font-size:2.05cqw; line-height:1.4; }
  .note{ font-size:1.45cqw; line-height:1.5; }

  .hl{ background:var(--accent); padding:0 .5cqw; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
  .inv{ background:var(--ink); color:var(--paper); padding:0 .6cqw; }

  .rise{ opacity:0; transform:translateY(2.4cqw); }
  .on .rise{ animation:rise .62s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes rise{ to{ opacity:1; transform:none; } }

  .slam{ opacity:0; transform:scale(1.1); }
  .on .slam{ animation:slam .36s cubic-bezier(.2,.9,.2,1) forwards; }
  @keyframes slam{ to{ opacity:1; transform:none; } }

  .wipe{ clip-path:inset(0 100% 0 0); }
  .on .wipe{ animation:wipe .7s cubic-bezier(.7,0,.2,1) forwards; }
  @keyframes wipe{ to{ clip-path:inset(0 0 0 0); } }

  .d1{ animation-delay:.20s!important } .d2{ animation-delay:.45s!important }
  .d3{ animation-delay:.75s!important } .d4{ animation-delay:1.10s!important }
  .d5{ animation-delay:1.50s!important } .d6{ animation-delay:1.95s!important }
  .d7{ animation-delay:2.45s!important }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:2.3cqw; }
  .box{ border:.31cqw solid var(--ink); padding:2cqw 2.1cqw; }
  .box .bt{ font-size:1.2cqw; font-weight:700; letter-spacing:.18em; text-transform:uppercase; border-bottom:.21cqw solid var(--ink); padding-bottom:.8cqw; margin-bottom:1.2cqw; }
  .box.fill{ background:var(--ink); color:var(--paper); }
  .box.fill .bt{ border-bottom-color:var(--paper); }
  .rowitem{ font-size:1.55cqw; line-height:1.5; }
  .dim{ opacity:.6; }

  .keyline{ display:flex; border:.31cqw solid var(--ink); font-size:3.3cqw; font-weight:700; }
  .keyline .seg{ padding:1.5cqw 1.9cqw; }
  .keyline .seg+.seg{ border-left:.31cqw solid var(--ink); }
  .seg.k{ background:var(--accent); }
  .seg.v{ flex:1; }
  .callout{ display:flex; gap:1.1cqw; align-items:flex-start; font-size:1.38cqw; line-height:1.5; margin-top:1cqw; }
  .callout .pin{ font-weight:700; background:var(--ink); color:var(--paper); padding:.2cqw .7cqw; white-space:nowrap; }

  .tape{ display:flex; gap:.5cqw; align-items:flex-end; height:11cqw; margin:.8cqw 0 1.4cqw; }
  .msg{ width:3.2cqw; border:.26cqw solid var(--ink); display:flex; align-items:flex-end; justify-content:center; font-size:.95cqw; font-weight:700; padding-bottom:.4cqw; }
  .msg.u{ height:56%; } .msg.a{ height:88%; background:var(--ink); color:var(--paper); }
  .on .msg.gone{ animation:rise .62s cubic-bezier(.2,.8,.2,1) forwards, drop .5s cubic-bezier(.6,0,.9,.3) forwards; }
  @keyframes drop{ to{ opacity:0; transform:translateY(7cqw) rotate(9deg); } }
  .on .msg.gone.g1{ animation-delay:0s, 1.5s } .on .msg.gone.g2{ animation-delay:.1s, 1.62s }
  .on .msg.gone.g3{ animation-delay:.2s, 1.74s } .on .msg.gone.g4{ animation-delay:.3s, 1.86s }
  .windowmark{ border-top:.31cqw solid var(--ink); padding-top:1.1cqw; font-size:1.55cqw; font-weight:700; letter-spacing:.06em; }

  .statusgrid{ display:grid; grid-template-columns:1fr 1fr; border:.31cqw solid var(--ink); }
  .statusgrid>div{ padding:2.1cqw 2.3cqw; }
  .statusgrid>div+div{ border-left:.31cqw solid var(--ink); }
  .st{ font-size:1.2cqw; font-weight:700; letter-spacing:.2em; text-transform:uppercase; margin-bottom:1cqw; }
  .sv{ font-size:1.72cqw; line-height:1.45; }
  .stamp{ display:inline-block; border:.26cqw solid var(--alert); color:var(--alert); font-weight:700; font-size:1.4cqw; letter-spacing:.16em; padding:.5cqw 1.1cqw; transform:rotate(-3deg); text-transform:uppercase; margin-top:1.3cqw; }

  .endgrid{ display:grid; grid-template-columns:repeat(3,1fr); border:.31cqw solid var(--ink); }
  .endgrid>div{ padding:2.1cqw 1.9cqw; }
  .endgrid>div+div{ border-left:.31cqw solid var(--ink); }
  .en{ font-family:'Archivo Black',sans-serif; font-size:3.3cqw; line-height:1; }
  .el{ font-size:1.28cqw; line-height:1.45; margin-top:.8cqw; }

  #hint{ position:fixed; bottom:10px; left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:.18em; text-transform:uppercase; opacity:.45; z-index:100; }
  body.playing #hint{ opacity:0; }
</style>
</head>
<body>

<div id="stage">
  <div id="railTop">
    <div class="cell" id="scene-name">SIGN-IN</div>
    <div class="cell">MEDHAVY HUB</div>
    <div class="cell" id="counter">00 / 06</div>
  </div>

  

  

  

  

  

  

  <section class="scene on" data-name="SIGN-IN" data-dur="9000">
    <div class="kicker rise">MEDHAVY HUB / MEMORY API</div>
    <h1 class="slam d1">MEMORY<br>API</h1>
    <div class="lede rise d3" style="margin-top:2.2cqw;max-width:74cqw">
      Hi, I am Chaitanya, and this video is about how the Memory API lets the tutor
      <span class="hl">remember a student across different textbooks</span>.
    </div>
  </section>
  <div id="progress"></div>
</div>

<div id="hint">space play / pause · ← → step · R restart</div>


</body>
</html>
